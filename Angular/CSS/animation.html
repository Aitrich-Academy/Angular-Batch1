<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation</title>
  <style>
    .anim {
      width: 100px;
      height: 100px;
      background-color: blue;
      position:relative;
      /* animation: move 3s; */
      animation-name: move;
      animation-duration: 15s;
      animation-iteration-count: 3;
      animation-fill-mode: forwards;
    }
    @keyframes move {
      0% { 
        left: 0; 
        top: 0;
        background-color: blue; 
      }
      25% { 
        left: 100px; 
        top: 0;
        background-color: green; 
      }
      /* 50% { left: 100px; background-color: yellow; } */
      50% {
         top: 100px; 
         left: 100px;
         background-color: rgb(208, 0, 255); }
      75% { 
        top: 100px; 
        left:0px; 
        background-color: orange; }
      100% { 
        top: 0px; 
        left: 0px; 
        background-color: red; }
    }


  </style>
</head>
<body>
  <div class="anim">

  </div>
</body>
</html>
