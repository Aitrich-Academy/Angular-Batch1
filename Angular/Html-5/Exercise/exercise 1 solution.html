<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HireMe Now!</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #fff;
    }
    .sidebar {
      height: 100vh;
      width: 200px;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #0056b3;
      padding-top: 20px;
      color: white;
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
    }
    .sidebar ul li {
      padding: 12px;
      text-align: left;
    }
    .sidebar ul li a {
      color: white;
      text-decoration: none;
      display: block;
    }
    .sidebar ul li a:hover {
      background: #003d80;
      padding-left: 10px;
      transition: 0.3s;
    }
    .topnav {
      margin-left: 200px;
      background: #f9f9f9;
      border-bottom: 1px solid #ddd;
      padding: 10px;
      display: flex;
      justify-content: space-between;
    }
    .topnav .links a {
      margin: 0 15px;
      text-decoration: none;
      color: #000;
    }
    .topnav .right {
      margin-right: 20px;
    }

    .content {
      margin-left: 200px;
      padding: 20px;
    }
    h3 {
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
      margin-top: 30px;
    }
    form {
      margin: 20px 0;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input[type="text"], input[type="email"], input[type="tel"], 
    input[type="password"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 15px;
      background-color: #0056b3;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 4px;
    }
    .notifications {
      margin-top: 10px;
    }

  </style>
</head>
<body>
  <!-- Sidebar -->
   <div class="sidebar">
    <h2>HireMe Now!</h2>
    <ul>
      <li><a href="#">Dash Board</a></li>
      <li><a href="#">Jobs</a></li>
      <li><a href="#">Applications</a></li>
      <li><a href="#">Interviews</a></li>
      <li><a href="#">Messages</a></li>
      <li><a href="#">Settings</a></li>
    </ul>
   </div>

   <!-- Top navigation -->
    <div class="topnav">
      <div class="links">
        <a href="#">Company Profile</a>
        <a href="#">Update Profile</a>
        <a href="#">Change UserName</a>
        <a href="#">Company Password</a>
      </div>
      <div>
        <span>🔔</span> &nbsp; <span> &nbsp; <a href="#">Logout</a></span>
      </div>
    </div>

  <!-- Content -->
   <div class="content">
    <h3>Change UserName</h3>
    <form onsubmit="return validateUsernameForm()">
      <label>FullName: </label>
      <input type="text" name="fullname" placeholder="Please enter your full name" required>

      <label>UserName :</label>
      <input type="text" name="username" placeholder="Please enter your user name" required>

      <label>Email :</label>
      <input type="text" name="username" placeholder="Please enter your email" required>

      <label>PhoneNo :</label>
      <input type="text" name="username" placeholder="Please enter your phone number" required>

      <button type="submit">Update Profile</button>

      <div>
        <input type="checkbox"> Push Notifications
        <input type="checkbox"> Email Notifications
      </div>
    </form>

    <h3>Password change</h3>
    <form onsubmit="return validatePasswordForm()">
      <label>UserID: </label>
      <input type="text" name="userid" placeholder="Please enter your user ID" required>

      <label>Old Password :</label>
      <input type="password" name="oldpass" placeholder="Please enter your Old Password" required>

      <label>New password :</label>
      <input type="password" name="newpass" placeholder="Please enter your New Password" required minlength="6">

      <label>Confirm password :</label>
      <input type="password" name="confirmpass" placeholder="Confirm New Password" required>

      <button type="submit">Update Profile</button>

      <div class="notifications">
        <input type="checkbox"> Push Notifications
        <input type="checkbox"> Email Notifications
      </div>
    </form>
   </div>

   <script>
    function validatePasswordForm() {
      const form =document.forms[1];
      const newPass = form['newpass'].value;
      const confirmPass = form['confirmpass'].value;
      if (newPass !== confirmPass) {
        alert("New Password and Confirm Password do not match.");
        return false;
      }
      return true;
    }
    function validateUsernameForm() {
      const form = document.forms[0];
      if(form["username"].value.length < 4) {
        alert("Username must be at least 4 characters.");
        return false;
      }
      return true;
    }
   </script>
</body>
</html>
