<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deprecated Table Attributes (for reference)</title>
</head>
<body style="font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:2rem;">
  <p><strong>note:</strong> The attributes below (<code>border</code>, <code>cellpadding</code>, <code>cellspacing</code>, <code>align</code>, <code>valign</code>) were common in HTML. </p>
  <table border="1" cellpadding="12" cellspacing="8" align="center">
    <tr><th align="left">Company</th><th>Position</th></tr>
    <tr><td rowspan="2" valign="top">TCS</td><td>Java Developer</td></tr>
    <tr><td>.NET Developer</td></tr>
  </table>
</body>
</html>
